<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deriv Pro Trader - Panel de Control</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root { --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #c9d1d9; --green: #2ea043; --red: #da3633; --blue: #58a6ff; --yellow: #d29922; --purple: #a371f7; }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
  body { background: var(--bg); color: var(--text); padding: 15px; font-size: 13px; }
  .container { max-width: 1400px; margin: 0 auto; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 15px; margin-bottom: 15px; }
  .card h3 { color: var(--blue); margin-bottom: 10px; font-size: 14px; border-bottom: 1px solid var(--border); padding-bottom: 5px; }
  .form-group { margin-bottom: 10px; }
  .form-group label { display: block; color: #8b949e; margin-bottom: 3px; font-size: 11px; }
  select, input { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border); padding: 6px; border-radius: 4px; }
  .btn { width: 100%; padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 5px; }
  .btn-primary { background: var(--green); color: white; }
  .btn-danger { background: var(--red); color: white; }
  .btn:disabled { background: var(--border); color: #8b949e; cursor: not-allowed; }
  .status-badge { display: inline-block; padding: 4px 10px; border-radius: 10px; font-size: 11px; font-weight: bold; }
  .status-connected { background: #1a4d2e; color: var(--green); }
  .status-disconnected { background: #4d1a1a; color: var(--red); }
  .log-container { height: 300px; overflow-y: auto; background: #010409; padding: 10px; border-radius: 4px; font-family: monospace; font-size: 11px; }
  .log-entry { margin-bottom: 3px; padding-left: 5px; border-left: 2px solid var(--border); }
  .log-info { border-color: var(--blue); color: var(--blue); }
  .log-success { border-color: var(--green); color: var(--green); font-weight: bold; }
  .log-error { border-color: var(--red); color: var(--red); }
  .log-trade { border-color: var(--yellow); color: var(--yellow); }
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat-item { background: var(--bg); padding: 8px; border-radius: 4px; }
  .stat-label { font-size: 10px; color: #8b949e; }
  .stat-value { font-size: 14px; font-weight: bold; color: var(--green); }
  .stat-value.red { color: var(--red); }
</style>
</head>
<body>

<div class="container">
  <div class="grid">
    <div>
      <div class="card">
        <h3>🔌 Conexión</h3>
        <div style="text-align: center; margin-bottom: 10px;">
          <span id="statusBadge" class="status-badge status-disconnected">Desconectado</span>
        </div>
        <div class="form-group">
          <label>Cuenta</label>
          <select id="accountSelect">
            <option value="">Selecciona una cuenta...</option>
          </select>
        </div>
        <button class="btn btn-primary" onclick="connectToAccount()">Conectar</button>
      </div>

      <div class="card">
        <h3>⚙️ Configuración del Bot</h3>
        <div class="form-group">
          <label>Estrategia</label>
          <select id="strategy">
            <option value="A">A - Tendencia (EMA + RSI)</option>
            <option value="B">B - Reversión (Bollinger + RSI)</option>
            <option value="C">C - Breakout (Ruptura de rango)</option>
            <option value="AI" selected>🤖 Ensemble IA (Recomendado)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Activo</label>
          <select id="symbol">
            <option value="R_10">Volatility 10</option>
            <option value="R_25">Volatility 25</option>
            <option value="R_50">Volatility 50</option>
            <option value="R_75" selected>Volatility 75</option>
            <option value="R_100">Volatility 100</option>
          </select>
        </div>
        <div class="form-group">
          <label>Granularidad</label>
          <select id="granularity">
            <option value="60">1 minuto</option>
            <option value="300" selected>5 minutos</option>
            <option value="900">15 minutos</option>
          </select>
        </div>
        <div class="form-group">
          <label>Umbral de Score (mínimo para operar)</label>
          <input type="number" id="threshold" value="75" min="30" max="90" step="5">
        </div>
        <div class="form-group">
          <label>Modo</label>
          <select id="mode">
            <option value="sim" selected>Simulación (Solo señales)</option>
            <option value="live">Real (Opera con dinero)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Stake Base ($)</label>
          <input type="number" id="stake" value="0.35" min="0.35" step="0.01">
        </div>
        <button class="btn btn-primary" onclick="updateConfig()">💾 Guardar Configuración</button>
      </div>

      <div class="card">
        <h3>🤖 Control del Bot</h3>
        <button id="btnStart" class="btn btn-primary" onclick="startBot()" disabled>▶ INICIAR BOT</button>
        <button id="btnStop" class="btn btn-danger" onclick="stopBot()" disabled>🛑 DETENER BOT</button>
      </div>
    </div>

    <div>
      <div class="card">
        <h3>📊 Estadísticas</h3>
        <div class="stats-grid">
          <div class="stat-item"><div class="stat-label">Saldo</div><div class="stat-value" id="balance">---</div></div>
          <div class="stat-item"><div class="stat-label">Trades Hoy</div><div class="stat-value" id="tradesToday">0</div></div>
          <div class="stat-item"><div class="stat-label">Ganadas</div><div class="stat-value" id="wins">0</div></div>
          <div class="stat-item"><div class="stat-label">Perdidas</div><div class="stat-value red" id="losses">0</div></div>
          <div class="stat-item"><div class="stat-label">Racha</div><div class="stat-value red" id="lossStreak">0</div></div>
          <div class="stat-item"><div class="stat-label">Stake Actual</div><div class="stat-value" id="currentStake">0.35</div></div>
        </div>
      </div>

      <div class="card">
        <h3>📈 Último Análisis</h3>
        <div style="text-align: center; padding: 10px;">
          <div style="font-size: 32px; font-weight: bold; color: var(--yellow);" id="lastScore">0</div>
          <div style="font-size: 11px; color: #8b949e;" id="lastDirection">Esperando...</div>
          <div style="font-size: 11px; color: #8b949e; margin-top: 5px;" id="lastReason">---</div>
        </div>
      </div>

      <div class="card">
        <h3>📝 Log del Servidor</h3>
        <div class="log-container" id="logContainer"></div>
      </div>
    </div>
  </div>
</div>

<script>
const SERVER_URL = "wss://deriv-proxy-hwhi.onrender.com";
let ws = null;
let accounts = [];

function log(msg, type = 'info') {
  const container = document.getElementById('logContainer');
  const div = document.createElement('div');
  div.className = `log-entry log-${type}`;
  div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  while (container.children.length > 100) container.removeChild(container.firstChild);
}

function connect() {
  if (ws && ws.readyState === WebSocket.OPEN) return;
  
  log("Conectando al servidor...", 'info');
  ws = new WebSocket(SERVER_URL);

  ws.onopen = () => {
    log("✅ Conectado al servidor", 'success');
    document.getElementById('statusBadge').textContent = 'Conectado';
    document.getElementById('statusBadge').className = 'status-badge status-connected';
  };

  ws.onmessage = (e) => {
    try {
      const data = JSON.parse(e.data);
      handleServerMessage(data);
    } catch (err) {
      log(`Error parseando: ${err.message}`, 'error');
    }
  };

  ws.onclose = () => {
    log("🔌 Desconectado del servidor", 'error');
    document.getElementById('statusBadge').textContent = 'Desconectado';
    document.getElementById('statusBadge').className = 'status-badge status-disconnected';
    setTimeout(connect, 3000);
  };

  ws.onerror = () => log("❌ Error de conexión", 'error');
}

function handleServerMessage(data) {
  if (data.type === 'ACCOUNTS_LIST') {
    accounts = data.accounts;
    const select = document.getElementById('accountSelect');
    select.innerHTML = '<option value="">Selecciona una cuenta...</option>';
    accounts.forEach(acc => {
      const option = document.createElement('option');
      option.value = acc.id;
      option.textContent = `${acc.type.toUpperCase()} - ${acc.balance} ${acc.currency} (${acc.id})`;
      select.appendChild(option);
    });
    log(`📋 ${accounts.length} cuentas disponibles`, 'info');
  }

  if (data.type === 'CONNECTED') {
    log(`✅ Conectado a cuenta: ${data.account_id}`, 'success');
    document.getElementById('btnStart').disabled = false;
  }

  if (data.type === 'BALANCE_UPDATE') {
    document.getElementById('balance').textContent = data.balance.toFixed(2);
  }

  if (data.type === 'ANALYSIS') {
    document.getElementById('lastScore').textContent = data.score.toFixed(1);
    document.getElementById('lastDirection').textContent = data.direction || 'N/A';
    document.getElementById('lastReason').textContent = data.reason;
  }

  if (data.type === 'TRADE_EXECUTED') {
    log(`✅ Operación ejecutada: ${data.contractId}`, 'trade');
  }

  if (data.type === 'TRADE_RESULT') {
    const result = data.isWin ? 'GANADA' : 'PERDIDA';
    log(`${data.isWin ? '✅' : '❌'} ${result}: ${data.profit.toFixed(2)}`, data.isWin ? 'success' : 'error');
    document.getElementById('tradesToday').textContent = data.stats.tradesToday;
    document.getElementById('wins').textContent = data.stats.wins;
    document.getElementById('losses').textContent = data.stats.losses;
    document.getElementById('lossStreak').textContent = data.stats.lossStreak;
    document.getElementById('currentStake').textContent = data.stats.currentStake.toFixed(2);
    if (data.stats.balance) document.getElementById('balance').textContent = data.stats.balance.toFixed(2);
  }

  if (data.type === 'SIMULATION_SIGNAL') {
    log(`🎯 [SIM] Señal: ${data.direction} | Score: ${data.score.toFixed(1)}`, 'trade');
  }

  if (data.type === 'SIGNAL_IGNORED') {
    log(`⚠️ Señal ignorada: ${data.reason}`, 'info');
  }

  if (data.type === 'BOT_STARTED') {
    log("🤖 Bot iniciado en el servidor", 'success');
    document.getElementById('btnStart').disabled = true;
    document.getElementById('btnStop').disabled = false;
  }

  if (data.type === 'BOT_STOPPED') {
    log("🛑 Bot detenido en el servidor", 'error');
    document.getElementById('btnStart').disabled = false;
    document.getElementById('btnStop').disabled = true;
  }

  if (data.type === 'CONFIG_UPDATED') {
    log("⚙️ Configuración actualizada en el servidor", 'info');
  }

  if (data.type === 'PROPOSAL_ERROR' || data.type === 'BUY_ERROR') {
    log(`❌ Error: ${data.message}`, 'error');
  }

  if (data.type === 'ERROR') {
    log(`❌ Error: ${data.message}`, 'error');
  }
}

function connectToAccount() {
  const accountId = document.getElementById('accountSelect').value;
  if (!accountId) {
    log("⚠️ Selecciona una cuenta primero", 'error');
    return;
  }
  ws.send(JSON.stringify({ type: 'SELECT_ACCOUNT', account_id: accountId }));
}

function updateConfig() {
  const config = {
    threshold: parseInt(document.getElementById('threshold').value),
    strategy: document.getElementById('strategy').value,
    symbol: document.getElementById('symbol').value,
    granularity: parseInt(document.getElementById('granularity').value),
    mode: document.getElementById('mode').value,
    stake: parseFloat(document.getElementById('stake').value)
  };
  ws.send(JSON.stringify({ type: 'UPDATE_CONFIG', config }));
  log(`⚙️ Enviando configuración: ${JSON.stringify(config)}`, 'info');
}

function startBot() {
  ws.send(JSON.stringify({ type: 'START_BOT' }));
}

function stopBot() {
  ws.send(JSON.stringify({ type: 'STOP_BOT' }));
}

window.onload = () => {
  log("🚀 Panel de control iniciado", 'info');
  connect();
};
</script>
</body>
</html>
