<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deriv Pro Trader</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root { --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #c9d1d9; --green: #2ea043; --red: #da3633; --blue: #58a6ff; --yellow: #d29922; }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
  body { background: var(--bg); color: var(--text); padding: 15px; font-size: 13px; }
  .container { max-width: 1400px; margin: 0 auto; }
  .grid { display: grid; grid-template-columns: 300px 1fr 300px; gap: 15px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 15px; margin-bottom: 15px; }
  .card h3 { color: var(--blue); margin-bottom: 10px; font-size: 14px; border-bottom: 1px solid var(--border); padding-bottom: 5px; }
  
  .account-selector { display: flex; gap: 10px; margin-bottom: 10px; }
  .account-btn { flex: 1; padding: 10px; border: 2px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); cursor: pointer; transition: 0.2s; }
  .account-btn:hover { border-color: var(--blue); }
  .account-btn.active { border-color: var(--green); background: #1a4d2e; }
  .account-btn .type { font-size: 10px; color: #8b949e; text-transform: uppercase; }
  .account-btn .balance { font-size: 18px; font-weight: bold; color: var(--green); margin-top: 3px; }
  .account-btn .id { font-size: 10px; color: #8b949e; margin-top: 2px; }

  .form-group { margin-bottom: 10px; }
  .form-group label { display: block; color: #8b949e; margin-bottom: 3px; font-size: 11px; }
  select, input { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border); padding: 6px; border-radius: 4px; }
  
  .btn { width: 100%; padding: 8px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 5px; }
  .btn-primary { background: var(--green); color: white; }
  .btn-danger { background: var(--red); color: white; }
  .btn:disabled { background: var(--border); color: #8b949e; cursor: not-allowed; }

  .chart-container { position: relative; height: 400px; width: 100%; }
  
  .log-container { height: 200px; overflow-y: auto; background: #010409; padding: 10px; border-radius: 4px; font-family: monospace; font-size: 11px; }
  .log-entry { margin-bottom: 3px; padding-left: 5px; border-left: 2px solid var(--border); }
  .log-info { border-color: var(--blue); color: var(--blue); }
  .log-success { border-color: var(--green); color: var(--green); }
  .log-error { border-color: var(--red); color: var(--red); }
  .log-trade { border-color: var(--yellow); color: var(--yellow); }

  .status-badge { display: inline-block; padding: 3px 8px; border-radius: 10px; font-size: 11px; font-weight: bold; }
  .status-connected { background: #1a4d2e; color: var(--green); }
  .status-disconnected { background: #4d1a1a; color: var(--red); }
</style>
</head>
<body>

<div class="container">
  <div class="grid">
    <!-- PANEL IZQUIERDO: CUENTAS Y CONFIGURACIÓN -->
    <div>
      <div class="card">
        <h3>👛 Mis Cuentas</h3>
        <div class="account-selector">
          <button class="account-btn" id="btnDemo" onclick="selectAccount('demo')">
            <div class="type">Demo</div>
            <div class="balance" id="demoBalance">---</div>
            <div class="id" id="demoId">Cargando...</div>
          </button>
          <button class="account-btn" id="btnReal" onclick="selectAccount('real')">
            <div class="type">Real</div>
            <div class="balance" id="realBalance">---</div>
            <div class="id" id="realId">Cargando...</div>
          </button>
        </div>
        <div style="text-align: center; margin-top: 10px;">
          <span id="statusBadge" class="status-badge status-disconnected">Desconectado</span>
        </div>
      </div>

      <div class="card">
        <h3>⚙️ Configuración</h3>
        <div class="form-group">
          <label>Activo</label>
          <select id="symbol" onchange="changeSymbol()">
            <option value="R_10">Volatility 10 Index</option>
            <option value="R_25">Volatility 25 Index</option>
            <option value="R_50">Volatility 50 Index</option>
            <option value="R_75" selected>Volatility 75 Index</option>
            <option value="R_100">Volatility 100 Index</option>
            <option value="1HZ100V">Volatility 100 (1s)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Granularidad</label>
          <select id="granularity" onchange="changeSymbol()">
            <option value="60">1 minuto</option>
            <option value="300" selected>5 minutos</option>
            <option value="900">15 minutos</option>
            <option value="1800">30 minutos</option>
            <option value="3600">1 hora</option>
          </select>
        </div>
      </div>

      <div class="card">
        <h3>📊 Estadísticas</h3>
        <div style="display: flex; justify-content: space-between; margin: 5px 0;">
          <span>Saldo Actual:</span>
          <span id="currentBalance" style="font-weight: bold; color: var(--green);">---</span>
        </div>
        <div style="display: flex; justify-content: space-between; margin: 5px 0;">
          <span>Cuenta Activa:</span>
          <span id="activeAccount" style="font-weight: bold;">---</span>
        </div>
        <div style="display: flex; justify-content: space-between; margin: 5px 0;">
          <span>Velas Cargadas:</span>
          <span id="candlesCount" style="font-weight: bold;">0</span>
        </div>
      </div>
    </div>

    <!-- PANEL CENTRAL: GRÁFICO -->
    <div>
      <div class="card">
        <h3>📈 Gráfico en Tiempo Real - <span id="chartSymbol">R_75</span></h3>
        <div class="chart-container">
          <canvas id="mainChart"></canvas>
        </div>
      </div>
    </div>

    <!-- PANEL DERECHO: LOGS -->
    <div>
      <div class="card">
        <h3>📝 Registro del Sistema</h3>
        <div class="log-container" id="logContainer"></div>
      </div>
    </div>
  </div>
</div>

<script>
// ==========================================
// CONFIGURACIÓN
// ==========================================
const SERVER_URL = "wss://deriv-proxy-hwhi.onrender.com";
let ws = null;
let chart = null;
let candles = [];
let currentAccountId = null;
let accountsData = { demo: null, real: null };
let subscriptionId = null;

// ==========================================
// INICIALIZACIÓN DEL GRÁFICO
// ==========================================
function initChart() {
  const ctx = document.getElementById('mainChart').getContext('2d');
  chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: [],
      datasets: [{
        label: 'Precio',
        data: [],
        borderColor: '#58a6ff',
        backgroundColor: 'rgba(88, 166, 255, 0.1)',
        borderWidth: 2,
        fill: true,
        tension: 0.1,
        pointRadius: 0
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { 
          grid: { color: '#30363d' }, 
          ticks: { color: '#8b949e', maxTicksLimit: 8, font: { size: 10 } }
        },
        y: { 
          grid: { color: '#30363d' }, 
          ticks: { color: '#8b949e' }
        }
      }
    }
  });
}

// ==========================================
// CONEXIÓN AL SERVIDOR
// ==========================================
function connect() {
  if (ws && ws.readyState === WebSocket.OPEN) return;
  
  log("Conectando al servidor...", 'info');
  ws = new WebSocket(SERVER_URL);

  ws.onopen = () => {
    log("✅ Conectado al servidor proxy", 'success');
  };

  ws.onmessage = (e) => {
    try {
      const data = JSON.parse(e.data);
      handleMessage(data);
    } catch (err) {
      log(`Error parseando: ${err.message}`, 'error');
    }
  };

  ws.onclose = () => {
    log("🔌 Conexión cerrada. Reconectando en 3s...", 'error');
    document.getElementById('statusBadge').textContent = 'Desconectado';
    document.getElementById('statusBadge').className = 'status-badge status-disconnected';
    setTimeout(connect, 3000);
  };

  ws.onerror = () => {
    log("❌ Error de conexión", 'error');
  };
}

// ==========================================
// MANEJO DE MENSAJES
// ==========================================
function handleMessage(data) {
  // Lista de cuentas recibida
  if (data.type === 'ACCOUNTS_LIST') {
    log(`📋 Recibidas ${data.accounts.length} cuentas`, 'info');
    processAccounts(data.accounts);
    return;
  }

  // Confirmación de conexión a cuenta específica
  if (data.type === 'CONNECTED') {
    log(`✅ Conectado a cuenta: ${data.account_id}`, 'success');
    document.getElementById('statusBadge').textContent = 'Conectado';
    document.getElementById('statusBadge').className = 'status-badge status-connected';
    currentAccountId = data.account_id;
    document.getElementById('activeAccount').textContent = data.account_id;
    
    // Pedir saldo y suscribirse a velas automáticamente
    requestBalance();
    subscribeToCandles();
    return;
  }

  if (data.type === 'DISCONNECTED') {
    log("🔌 Desconectado de Deriv", 'error');
    return;
  }

  if (data.type === 'ERROR') {
    log(`❌ Error: ${data.message}`, 'error');
    return;
  }

  // Respuesta de balance
  if (data.msg_type === 'balance') {
    const balance = parseFloat(data.balance.balance);
    const currency = data.balance.currency;
    const accId = data.balance.loginid;
    
    // Actualizar el saldo de la cuenta correspondiente
    if (accountsData.demo && accountsData.demo.id === accId) {
      accountsData.demo.balance = balance;
      document.getElementById('demoBalance').textContent = balance.toFixed(2) + ' ' + currency;
    } else if (accountsData.real && accountsData.real.id === accId) {
      accountsData.real.balance = balance;
      document.getElementById('realBalance').textContent = balance.toFixed(2) + ' ' + currency;
    }
    
    document.getElementById('currentBalance').textContent = balance.toFixed(2) + ' ' + currency;
    log(`💰 Saldo actualizado: ${balance.toFixed(2)} ${currency}`, 'success');
    return;
  }

  // Histórico de velas
  if (data.msg_type === 'history') {
    candles = data.history.prices.map((p, i) => ({
      time: data.history.times[i],
      price: parseFloat(p)
    }));
    updateChart();
    log(`📊 Histórico cargado: ${candles.length} velas`, 'info');
    return;
  }

  // Ticks en tiempo real (cuando style=ticks)
  if (data.msg_type === 'tick') {
    const price = parseFloat(data.tick.quote);
    const time = data.tick.epoch;
    
    // Actualizar última vela o crear nueva
    const lastCandle = candles[candles.length - 1];
    if (lastCandle && time - lastCandle.time < 60) {
      lastCandle.price = price;
    } else {
      candles.push({ time, price });
      if (candles.length > 100) candles.shift();
    }
    updateChart();
    return;
  }

  // Velas OHLC en tiempo real
  if (data.msg_type === 'ohlc') {
    const ohlc = data.ohlc;
    const candle = {
      time: parseInt(ohlc.open_time),
      price: parseFloat(ohlc.close)
    };
    
    const lastCandle = candles[candles.length - 1];
    if (lastCandle && lastCandle.time === candle.time) {
      candles[candles.length - 1] = candle;
    } else {
      candles.push(candle);
      if (candles.length > 100) candles.shift();
    }
    updateChart();
    return;
  }

  // Confirmación de suscripción
  if (data.msg_type === 'subscription') {
    subscriptionId = data.subscription.id;
    log(`📡 Suscripción activa (ID: ${subscriptionId})`, 'info');
    return;
  }
}

// ==========================================
// PROCESAR LISTA DE CUENTAS
// ==========================================
function processAccounts(accounts) {
  accounts.forEach(acc => {
    if (acc.type === 'demo' && (!accountsData.demo || acc.status === 'active')) {
      accountsData.demo = acc;
      document.getElementById('demoId').textContent = acc.id;
      document.getElementById('demoBalance').textContent = parseFloat(acc.balance).toFixed(2) + ' ' + acc.currency;
    } else if (acc.type === 'real' && (!accountsData.real || acc.status === 'active')) {
      accountsData.real = acc;
      document.getElementById('realId').textContent = acc.id;
      document.getElementById('realBalance').textContent = parseFloat(acc.balance).toFixed(2) + ' ' + acc.currency;
    }
  });

  // Auto-seleccionar cuenta real si existe
  if (accountsData.real) {
    selectAccount('real');
  } else if (accountsData.demo) {
    selectAccount('demo');
  }
}

// ==========================================
// SELECCIONAR CUENTA
// ==========================================
function selectAccount(type) {
  const account = accountsData[type];
  if (!account) {
    log(`⚠️ No hay cuenta ${type} disponible`, 'error');
    return;
  }

  // Actualizar UI
  document.getElementById('btnDemo').classList.toggle('active', type === 'demo');
  document.getElementById('btnReal').classList.toggle('active', type === 'real');
  
  log(`🎯 Seleccionando cuenta ${type}: ${account.id}`, 'info');
  
  // Enviar al servidor para que se conecte a esa cuenta
  ws.send(JSON.stringify({
    type: 'SELECT_ACCOUNT',
    account_id: account.id
  }));
}

// ==========================================
// SOLICITAR SALDO
// ==========================================
function requestBalance() {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ balance: 1, subscribe: 1 }));
  }
}

// ==========================================
// SUSCRIBIRSE A VELAS
// ==========================================
function subscribeToCandles() {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  
  const symbol = document.getElementById('symbol').value;
  const granularity = parseInt(document.getElementById('granularity').value);
  
  // Cancelar suscripción anterior si existe
  if (subscriptionId) {
    ws.send(JSON.stringify({ forget: subscriptionId }));
    subscriptionId = null;
  }

  // Limpiar velas anteriores
  candles = [];
  updateChart();

  log(`📡 Suscribiendo a ${symbol} (granularidad: ${granularity}s)...`, 'info');
  
  ws.send(JSON.stringify({
    ticks_history: symbol,
    adjust_start_time: 1,
    count: 100,
    end: 'latest',
    style: 'candles',
    granularity: granularity,
    subscribe: 1
  }));

  document.getElementById('chartSymbol').textContent = symbol;
}

// ==========================================
// CAMBIAR ACTIVO
// ==========================================
function changeSymbol() {
  const symbol = document.getElementById('symbol').value;
  log(`🔄 Cambiando a ${symbol}...`, 'info');
  subscribeToCandles();
}

// ==========================================
// ACTUALIZAR GRÁFICO
// ==========================================
function updateChart() {
  if (!chart || candles.length === 0) return;
  
  chart.data.labels = candles.map(c => {
    const date = new Date(c.time * 1000);
    return date.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
  });
  chart.data.datasets[0].data = candles.map(c => c.price);
  chart.update();
  
  document.getElementById('candlesCount').textContent = candles.length;
}

// ==========================================
// SISTEMA DE LOGS
// ==========================================
function log(msg, type = 'info') {
  const container = document.getElementById('logContainer');
  const time = new Date().toLocaleTimeString();
  const div = document.createElement('div');
  div.className = `log-entry log-${type}`;
  div.textContent = `[${time}] ${msg}`;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  
  // Limitar logs a 100 entradas
  while (container.children.length > 100) {
    container.removeChild(container.firstChild);
  }
}

// ==========================================
// INICIALIZACIÓN
// ==========================================
window.onload = () => {
  initChart();
  connect();
  log("🚀 Sistema iniciado. Esperando cuentas...", 'info');
};
</script>
</body>
</html>
